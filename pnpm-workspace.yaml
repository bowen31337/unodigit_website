# Every deployable and shared library lives under apps/* or packages/*; the
# repository root is workspace metadata only (no sources, no app manifest).
#
# The Next.js marketing site is `apps/web` (@unodigit/web). CI still runs
# `pnpm build` at the root — that now delegates via `turbo build --filter=@unodigit/web`
# and the static export lands in apps/web/out, which the Pages deploy expects.
packages:
  - "apps/*"
  - "packages/*"
