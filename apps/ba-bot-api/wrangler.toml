name = "unodigit-ba-bot"
main = "src/index.ts"
compatibility_date = "2026-08-18"
compatibility_flags = ["nodejs_compat"]

# Custom domains on claw-forge.net, which is a real Cloudflare zone on this
# account. unodigit.com.au is not: its nameservers are at OnlyDomains, so
# Cloudflare *serves* it but does not *manage* it, and a Workers custom domain
# — like a Cloudflare Access application — needs a zone it can attach to.
# That is the whole reason the admin surface lived in shell scripts.
#
# `custom_domain = true` makes wrangler create and own the DNS record, so these
# two lines are the only place the hostnames are configured.
#
# The Worker still answers on unodigit-ba-bot.unodigit.workers.dev regardless.
# That is why src/api/admin.ts gates on ADMIN_HOSTNAME rather than trusting
# that only the routes below can reach it.
routes = [
  { pattern = "api.claw-forge.net", custom_domain = true },
  { pattern = "admin.claw-forge.net", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "ba_bot"
database_id = "ce21fa57-71ce-4040-b866-b0662c70417b"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "SESSIONS"
id = "ff8819dac21943bdb02bf0c3efe79509"

[vars]
# Provider config. Not confidential, so kept here rather than as secrets:
# visible in review, diffable, and changing a model is a normal code change.
# The API key itself is a secret — see scripts/sync-secrets.sh.
#
# DeepSeek exposes two wire formats. This must stay the OpenAI one, because
# src/llm/openai-compat.ts speaks chat/completions. The Anthropic-format
# endpoint (https://api.deepseek.com/anthropic) would need a different adapter.
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-v4-flash"
LLM_MODEL_HEAVY = "deepseek-v4-pro"

# RATE and MINIMUM are COUPLED through PROGRAM_MODE_THRESHOLD and must always
# be changed together. Single mode tops out at the threshold (300 tasks), so the
# largest reachable single-mode midpoint is 300 x maxWeight(1.5) x RATE. If that
# ceiling sits under the floor, belowFloor is true for EVERY single-mode quote
# and the price band — the product — never renders. That is not hypothetical:
# it shipped once, with RATE=10 against a 6000 floor giving a A$4,500 ceiling,
# and every unit test passed because nothing compared the two numbers.
#
# Set deliberately low to attract early clients. At RATE=10 a typical 300-task
# project prices ~A$3,150 and a 200-task one ~A$2,100, both clearing the A$2,000
# floor; work small enough to be a starter engagement still falls under it,
# which is what the floor is for.
#
# Before changing either: compute 300 x 1.5 x RATE and confirm it exceeds
# MINIMUM_ENGAGEMENT_AUD. Three tests in test/pricing/quote.test.ts read these
# values from THIS file through the pool's configPath and will fail if you
# don't — that guard is the only reason the incoherence cannot return silently.
RATE_PER_TASK_AUD = "10"
MINIMUM_ENGAGEMENT_AUD = "2000"
# A DELIVERY COMMITMENT, not an estimate — it sets the "roughly N weeks" line
# the client reads, via weeks = max(1, ceil(weightedTasks / TASKS_PER_WEEK)).
#
# 500 reflects a parallel agent harness rather than a human team: claw-forge
# runs concurrent agents, so throughput is a function of concurrency, not
# headcount. At 500 essentially every single-mode project lands on the floor of
# "roughly 1 week" (a 300-task project is 315 weighted, so ceil(315/500) = 1),
# and only multi-subsystem programs report more.
#
# Know what that means for the artifact: the timeline stops discriminating
# between a 42-task tool and a 300-task platform — both read "roughly 1 week"
# while their prices differ 7x. If a client is meant to read scale off the
# timeline, this is the var that stops carrying that signal.
TASKS_PER_WEEK = "500"
PROGRAM_MODE_THRESHOLD = "300"
QUOTE_VALID_DAYS = "30"
MAX_TOTAL_TURNS = "40"
# Per-IP daily cap on chat turns. MAX_TOTAL_TURNS caps a single session, not how
# many sessions one attacker opens — without this an attacker creates unlimited
# conversations, each spending up to 40 DeepSeek turns. 120 is three full
# 40-turn interviews from one address per day, which no genuine visitor reaches.
MAX_TURNS_PER_IP_PER_DAY = "120"
# Comma-separated allowlist, split in src/index.ts. The site is unodigit.com.AU —
# the old value (`https://unodigit.com`) was a different domain entirely and would
# have failed every browser call with an opaque CORS error. The apex is listed for
# when its DNS starts resolving; only `www` does today. localhost covers `pnpm dev`.
ALLOWED_ORIGIN = "https://www.unodigit.com.au,https://unodigit.com.au,http://localhost:3000"
# Where the emailed quote link points. Separate from ALLOWED_ORIGIN on purpose:
# that is a CORS allowlist that contains localhost, and reordering it must never
# change the URL a client receives in their inbox. The /q/ route is Plan 3.
PUBLIC_SITE_URL = "https://www.unodigit.com.au"

# --- Admin surface (src/api/admin.ts) -------------------------------------
#
# All three must be set for /admin/* to answer at all; any one left empty and
# every admin request 404s or 401s. That is the intended failure: a deploy that
# is half-configured must publish nothing, not a dashboard with a broken lock.
#
# None of these is a secret. ACCESS_AUD and the team domain appear in every
# token Access issues, so they belong here in plaintext where they can be
# reviewed and diffed — unlike the entries in sync-secrets.sh.
#
# ADMIN_HOSTNAME is the primary gate. The Worker is reachable on
# unodigit-ba-bot.unodigit.workers.dev no matter what `routes` says above, and
# that hostname has no Access in front of it, so the hostname check is what
# keeps the dashboard off the open internet.
ADMIN_HOSTNAME = "admin.claw-forge.net"
# <team>.cloudflareaccess.com — the JWKS host and the expected `iss`.
# TODO: fill from the Cloudflare Zero Trust team domain before deploying.
ACCESS_TEAM_DOMAIN = ""
# The Access application's Audience (AUD) tag. Created with the application;
# copy it from Zero Trust → Access → Applications → (the admin app) → Overview.
# TODO: fill before deploying. Empty means every admin request 401s.
ACCESS_AUD = ""
